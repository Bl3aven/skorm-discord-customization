name: Validate themes and plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate generated themes
        run: python scripts/build_themes.py --check

      - name: Validate BetterDiscord plugin syntax
        run: node --check SkormThemeSync.plugin.js

      - name: Validate guild route scoping
        run: node scripts/test_plugin_scope.js

      - name: Validate animated backgrounds
        run: |
          for theme in cyberpunk galaxy greek hell tropical; do
            asset="assets/backgrounds-animated/${theme}.webp"
            test -f "$asset"
            test "$(wc -c < "$asset")" -gt 500000
            test "$(wc -c < "$asset")" -lt 8000000
            file "$asset" | grep -q "Web/P image"
            grep -a -q "ANIM" "$asset"
          done
